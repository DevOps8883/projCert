apiVersion: apps/v1
kind: Deployment
metadata:
  name: applebite-deployment
  labels:
    app: applebite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: applebite
  template:
    metadata:
      labels:
        app: applebite
    spec:
      containers:
      - name: applebite-container
        image: applebite-app:latest
        imagePullPolicy: Always # Crucial: Tells Kubernetes to use the image you just built locally
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: applebite-service
spec:
  type: LoadBalancer # Exposes the app to your local machine
  selector:
    app: applebite
  ports:
    - protocol: TCP
      port: 8081      # The port you type into your browser (localhost:8081)
      targetPort: 80  # The port inside the container
      
