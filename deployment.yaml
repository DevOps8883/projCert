apiVersion: apps/v1
kind: Deployment
metadata:
  name: applebite-deployment
  labels:
    app: applebite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: applebite
  template:
    metadata:
      labels:
        app: applebite
    spec:
      imagePullSecrets:              # 🟢 FIXED: Moved out of containers block and indented with 6 spaces
        - name: my-registry-key
      containers:
        - name: applebite-container   # 🟢 FIXED: Properly indented under containers list
          image: davidadeleke23/applebite-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: applebite-service
spec:
  type: LoadBalancer
  selector:
    app: applebite
  ports:
    - protocol: TCP
      port: 8081      
      targetPort: 80
